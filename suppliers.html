
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - CargoVis</title>

  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</head>

<body>

  <nav class="navbar">
    <div class="nav-brand">CargoVis</div>

    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="active.html">Active</a>
      <a href="archive.html">Archive</a>
      <a href="suppliers.html" class="editor-only active">Suppliers</a>
    </div>

    <div class="nav-user">
      <span id="currentDate"></span>
      <span id="userAvatar" class="user-avatar"></span>
    </div>
  </nav>

  <main class="page-container">
    <div class="page-header">
      <h1>Suppliers</h1>
      <p>Manage suppliers and view their active container counts.</p>
    </div>

    <div id="viewerNotice" style="display:none; margin-bottom:20px;">
      You have read-only access to supplier information.
    </div>

    <section class="editor-only">
      <h2>Add Supplier</h2>

      <form id="supplierForm">
        <div class="form-group">
          <label for="supplierName">Supplier Name</label>
          <input
            type="text"
            id="supplierName"
            placeholder="Enter supplier name"
            required
          >
        </div>

        <div class="form-group">
          <label for="supplierContact">Contact Person</label>
          <input
            type="text"
            id="supplierContact"
            placeholder="Enter contact person"
          >
        </div>

        <div class="form-group">
          <label for="supplierPhone">Phone</label>
          <input
            type="text"
            id="supplierPhone"
            placeholder="Enter phone number"
          >
        </div>

        <div class="form-group">
          <label for="supplierEmail">Email</label>
          <input
            type="email"
            id="supplierEmail"
            placeholder="Enter email address"
          >
        </div>

        <button type="submit" id="addSupplierBtn">
          Add Supplier
        </button>
      </form>
    </section>

    <section>
      <h2>Supplier List</h2>

      <p id="pageMessage"></p>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Supplier Name</th>
              <th>Contact Person</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Active Containers</th>
            </tr>
          </thead>

          <tbody id="suppliersList">
            <tr>
              <td colspan="5">Loading suppliers...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let currentProfile = null;
    let db = null;

    window.addEventListener("load", async function () {
      try {
        const message = document.getElementById("pageMessage");

        message.textContent = "Checking your session...";

        const session = await Auth.restoreSession();

        if (!session.success) {
          window.location.href = "login.html";
          return;
        }

        currentProfile = session.profile;
        db = window.AppDB.supabaseClient;

        document.body.classList.toggle(
          "viewer",
          currentProfile.role === "viewer"
        );

        Auth.applyRoleVisibility();

        const avatar = document.getElementById("userAvatar");

        if (avatar && currentProfile.username) {
          avatar.textContent = currentProfile.username
            .substring(0, 2)
            .toUpperCase();

          avatar.title =
            currentProfile.username + " — " +
            currentProfile.role + " — Log out";

          avatar.style.cursor = "pointer";
          avatar.addEventListener("click", async function () {
            await Auth.logout();
            window.location.href = "login.html";
          });
        }

        document.getElementById("currentDate").textContent =
          new Date().toLocaleDateString();

        if (!db) {
          throw new Error("Supabase client could not be loaded.");
        }

        if (!Auth.isEditor()) {
          document.getElementById("viewerNotice").style.display = "block";
        }

        await loadSuppliers();

        document.getElementById("supplierForm")
          .addEventListener("submit", addSupplier);

      } catch (error) {
        console.error("Suppliers page error:", error);

        document.getElementById("pageMessage").textContent =
          "Unable to load suppliers: " + error.message;
      }
    });

    async function loadSuppliers() {
      const list = document.getElementById("suppliersList");
      const message = document.getElementById("pageMessage");

      list.innerHTML = "<tr><td colspan='5'>Loading suppliers...</td></tr>";

      const { data: suppliers, error } = await db
        .from("suppliers")
        .select("*")
        .order("name", { ascending: true });

      if (error) {
        throw error;
      }

      const { data: containers, error: containerError } = await db
        .from("containers")
        .select("supplier_id")
        .eq("status", "active");

      if (containerError) {
        throw containerError;
      }

      const counts = {};

      (containers || []).forEach(container => {
        if (container.supplier_id) {
          counts[container.supplier_id] =
            (counts[container.supplier_id] || 0) + 1;
        }
      });

      if (!suppliers || suppliers.length === 0) {
        list.innerHTML =
          "<tr><td colspan='5'>No suppliers found.</td></tr>";

        message.textContent = "";
        return;
      }

      list.innerHTML = "";

      suppliers.forEach(supplier => {
        const row = document.createElement("tr");

        const values = [
          supplier.name || "",
          supplier.contact_person || "",
          supplier.phone || "",
          supplier.email || "",
          counts[supplier.id] || 0
        ];

        values.forEach(value => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });

        list.appendChild(row);
      });

      message.textContent = "";
    }

    async function addSupplier(event) {
      event.preventDefault();

      if (!Auth.isEditor()) {
        alert("You do not have permission to add suppliers.");
        return;
      }

      const button = document.getElementById("addSupplierBtn");
      const name = document.getElementById("supplierName").value.trim();
      const contact = document.getElementById("supplierContact").value.trim();
      const phone = document.getElementById("supplierPhone").value.trim();
      const email = document.getElementById("supplierEmail").value.trim();

      if (!name) {
        alert("Please enter a supplier name.");
        return;
      }

      button.disabled = true;
      button.textContent = "Saving...";

      try {
        const { error } = await db
          .from("suppliers")
          .insert([{
            name: name,
            contact_person: contact || null,
            phone: phone || null,
            email: email || null
          }]);

        if (error) {
          throw error;
        }

        document.getElementById("supplierForm").reset();

        alert("Supplier added successfully.");

        await loadSuppliers();

      } catch (error) {
        console.error("Add supplier error:", error);
        alert("Could not add supplier: " + error.message);

      } finally {
        button.disabled = false;
        button.textContent = "Add Supplier";
      }
    }
  </script>

</body>
</html>
```
