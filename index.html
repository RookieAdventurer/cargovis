<script>
"use strict";

// --------------------------------------------------
// APPLICATION STATE
// --------------------------------------------------

let db;
let allContainers = [];
let allSuppliers = [];
let activeDetailId = null;
let currentView = "supplier";
let currentProfile = null;
let pendingRows = [];

// --------------------------------------------------
// HTML SAFETY HELPERS
// --------------------------------------------------

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function buildSupplierOptions(selectedId) {
  const selected = String(selectedId ?? "");

  return `
    <option value="">Select supplier</option>
    ${allSuppliers.map(s => `
      <option
        value="${escapeHTML(s.id)}"
        ${String(s.id) === selected ? "selected" : ""}
      >${escapeHTML(s.name)}</option>
    `).join("")}
  `;
}

function recipientSuggestions() {
  return `
    <datalist id="recipientOptions">
      <option value="WAGYINGO">
      <option value="Lucy">
    </datalist>
  `;
}

// --------------------------------------------------
// INITIALISATION AND AUTHENTICATION
// --------------------------------------------------

window.addEventListener("load", async function() {
  try {
    showLoading("Checking your account...", "Verifying your session");

    const session = await Auth.restoreSession();

    if (!session.success) {
      window.location.href = "login.html";
      return;
    }

    currentProfile = session.profile;
    db = window.AppDB.supabaseClient;

    document.body.classList.toggle(
      "viewer",
      currentProfile.role === "viewer"
    );

    Auth.applyRoleVisibility();

    const avatar = document.getElementById("userAvatar");
    avatar.textContent = currentProfile.username
      .substring(0, 2)
      .toUpperCase();

    avatar.title = currentProfile.username + " — " +
      currentProfile.role + " — Log out";

    document.getElementById("todayDate").textContent =
      fmtDate(new Date().toISOString());

    await initDashboard();

  } catch (error) {
    console.error("Dashboard initialisation error:", error);
    hideLoading();
    alert("Unable to load CargoVis. Please refresh the page.");
  }
});

async function handleLogout() {
  if (confirm("Log out of CargoVis?")) {
    await Auth.logout();
  }
}

// --------------------------------------------------
// DATABASE FUNCTIONS
// --------------------------------------------------

async function fetchContainers() {
  const {data, error} = await db
    .from("containers")
    .select("*,suppliers(name)")
    .order("eta", {ascending:true});

  if (error) throw error;

  return (data || []).map(c => ({
    ...c,
    status: computeStatus(c)
  }));
}

async function fetchArchived() {
  const {data, error} = await db
    .from("archived_containers")
    .select("*,suppliers(name)")
    .order("emptied_on", {ascending:false});

  if (error) throw error;
  return data || [];
}

async function fetchSuppliers() {
  const {data, error} = await db
    .from("suppliers")
    .select("*")
    .order("name");

  if (error) throw error;
  return data || [];
}

async function addContainersDB(rows) {
  const payload = rows.map(r => ({
    ...r,
    status: "NOT ARRIVED",
    created_by: currentProfile?.username || null
  }));

  const {data, error} = await db
    .from("containers")
    .insert(payload)
    .select();

  if (error) return {success:false, message:error.message};

  return {success:true, containers:data};
}

async function updateContainerDB(id, updates) {
  const payload = {
    ...updates,
    updated_at: new Date().toISOString()
  };

  if (updates.eta) {
    payload.status = "NOT ARRIVED";
  }

  const {data, error} = await db
    .from("containers")
    .update(payload)
    .eq("id", id)
    .select()
    .single();

  if (error) return {success:false, message:error.message};

  return {success:true, container:data};
}

async function deleteContainerDB(id) {
  const {error} = await db
    .from("containers")
    .delete()
    .eq("id", id);

  if (error) return {success:false, message:error.message};

  return {success:true};
}

async function markEmptiedDB(c) {
  const row = {
    container_number: c.container_number,
    vessel: c.vessel,
    eta: c.eta,
    shipping_line: c.shipping_line,
    supplier_id: c.supplier_id,
    shipment_id: c.shipment_id || null,
    recipient: c.recipient,
    packing_list_url: c.packing_list_url,
    packing_list_filename: c.packing_list_filename,
    created_at: c.created_at,
    emptied_on: new Date().toISOString().split("T")[0],
    emptied_by: currentProfile?.username || null
  };

  const {error:e1} = await db
    .from("archived_containers")
    .insert(row);

  if (e1) return {success:false, message:e1.message};

  const {error:e2} = await db
    .from("containers")
    .delete()
    .eq("id", c.id);

  if (e2) {
    return {
      success:false,
      message:"The archive copy was created, but the active record could not be removed. Please contact the administrator before trying again. " + e2.message
    };
  }

  return {success:true};
}

// --------------------------------------------------
// STATUS AND DATE HELPERS
// --------------------------------------------------

function computeStatus(container) {
  if (typeof container === "string") return "NOT ARRIVED";

  if (container?.actual_arrival_at || container?.arrived_at) {
    return "ARRIVED";
  }

  return "NOT ARRIVED";
}

function fmtDate(s) {
  if (!s) return "—";

  const d = new Date(
    /^\d{4}-\d{2}-\d{2}$/.test(s) ? s + "T00:00:00" : s
  );

  if (Number.isNaN(d.getTime())) return "—";

  const days = [
    "Sunday","Monday","Tuesday","Wednesday",
    "Thursday","Friday","Saturday"
  ];

  const months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  const n = d.getDate();
  const suffix = (n >= 11 && n <= 13)
    ? "th"
    : ({1:"st",2:"nd",3:"rd"}[n % 10] || "th");

  return `${days[d.getDay()]}, ${n}${suffix} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function detectLine(n) {
  const m = {
    MRKU:"MAERSK",MSKU:"MAERSK",MSDU:"MAERSK",
    MRSU:"MAERSK",SUDU:"MAERSK",SEAU:"MAERSK",
    HASU:"MAERSK",TRHU:"MAERSK",TXGU:"HAPAG",
    HLXU:"HAPAG",HLCU:"HAPAG",SEKU:"CMA CGM",
    CMAU:"CMA CGM",CGMU:"CMA CGM",MSCU:"MSC",
    MEDU:"MSC"
  };

  return m[n.trim().toUpperCase().slice(0,4)] || "UNKNOWN";
}

// --------------------------------------------------
// LOADING AND VIEW CONTROLS
// --------------------------------------------------

function showLoading(title, subtitle) {
  const el = document.getElementById("loadingScreen");
  document.getElementById("loadingTitle").textContent = title;
  document.getElementById("loadingSub").textContent = subtitle || "";
  el.classList.remove("hidden");
}

function hideLoading() {
  document.getElementById("loadingScreen").classList.add("hidden");
}

function setView(v) {
  currentView = v;

  document.getElementById("viewBySupplier")
    .classList.toggle("active", v === "supplier");

  document.getElementById("viewByTimeline")
    .classList.toggle("active", v === "timeline");

  renderTable();
}

// --------------------------------------------------
// DASHBOARD
// --------------------------------------------------

async function initDashboard() {
  showLoading("Loading your containers...", "Fetching from the database");

  allSuppliers = await fetchSuppliers();
  allContainers = await fetchContainers();

  populateSupplierFilter();
  updateStats();
  renderTable();

  hideLoading();
}

function populateSupplierFilter() {
  const sel = document.getElementById("filterSupplier");
  sel.innerHTML = '<option value="">All suppliers</option>';

  allSuppliers.forEach(s => {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.name;
    sel.appendChild(o);
  });
}
    const missingETA = pendingRows.filter(r => !r.eta);
  const missingSupplier = pendingRows.filter(r => !r.supplier_id);
  const missingRecipient = pendingRows.filter(r => !r.recipient.trim());

  if (missingETA.length) {
    alert(`Please enter ETA for: ${missingETA.map(r => r.container_number).join(", ")}`);
    return;
  }

  if (missingSupplier.length) {
    alert(`Please select a supplier for: ${missingSupplier.map(r => r.container_number).join(", ")}`);
    return;
  }

  if (missingRecipient.length) {
    alert(`Please enter a recipient for: ${missingRecipient.map(r => r.container_number).join(", ")}`);
    return;
  }

  showLoading("Saving containers...", "Adding to your tracker");

  const result = await addContainersDB(pendingRows);

  hideLoading();

  if (!result.success) {
    alert("Error: " + result.message);
    return;
  }

  closeModal();
  allContainers = await fetchContainers();
  renderTable();
  updateStats();
}

// --------------------------------------------------
// EDIT CONTAINER
// --------------------------------------------------

async function openEditModal(id) {
  if (!Auth.isEditor()) return;

  if (!allSuppliers.length) {
    allSuppliers = await fetchSuppliers();
  }

  const c = allContainers.find(x => x.id === id);
  if (!c) return;

  const opts = buildSupplierOptions(c.supplier_id);

  document.getElementById("modalRoot").innerHTML = `
    <div class="modal-overlay" onclick="closeOverlay(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">Edit container</div>

        <div class="form-row">
          <label class="form-label">Container number</label>
          <input class="form-input" id="eNum" value="${escapeHTML(c.container_number)}" style="font-family:monospace">
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">Supplier</label>
            <select class="form-select" id="eSup">${opts}</select>
          </div>
          <div class="form-row">
            <label class="form-label">Shipping line</label>
            <select class="form-select" id="eLine">
              ${["MAERSK","HAPAG","CMA CGM","MSC","UNKNOWN"].map(l =>
                `<option ${c.shipping_line === l ? "selected" : ""}>${l}</option>`
              ).join("")}
            </select>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">Vessel</label>
          <input class="form-input" id="eVes" value="${escapeHTML(c.vessel || "")}">
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">ETA</label>
            <input type="date" class="form-input" id="eEta" value="${escapeHTML(c.eta || "")}">
          </div>
          <div class="form-row">
            <label class="form-label">Recipient</label>
            <input
              class="form-input"
              id="eRec"
              list="recipientOptions"
              value="${escapeHTML(c.recipient || "WAGYINGO")}"
              placeholder="Enter recipient name"
            >
            ${recipientSuggestions()}
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveEdit('${id}')">Save changes</button>
        </div>
      </div>
    </div>`;
}

async function saveEdit(id) {
  if (!Auth.isEditor()) return;

  const updates = {
    container_number:document.getElementById("eNum").value.trim().toUpperCase(),
    supplier_id:document.getElementById("eSup").value,
    shipping_line:document.getElementById("eLine").value,
    vessel:document.getElementById("eVes").value,
    eta:document.getElementById("eEta").value,
    recipient:document.getElementById("eRec").value.trim()
  };

  if (!updates.supplier_id) {
    alert("Please select a supplier.");
    return;
  }

  if (!updates.recipient) {
    alert("Please enter a recipient.");
    return;
  }

  showLoading("Saving...", "");

  const result = await updateContainerDB(id, updates);

  hideLoading();

  if (!result.success) {
    alert("Error: " + result.message);
    return;
  }

  closeModal();
  allContainers = await fetchContainers();
  renderTable();
  updateStats();
}

// --------------------------------------------------
// ARCHIVE AND DELETE
// --------------------------------------------------

async function doMarkEmptied(id) {
  if (!Auth.isEditor()) return;

  const c = allContainers.find(x => x.id === id);

  if (!c || !confirm(`Mark ${c.container_number} as emptied? It will move to the archive.`)) {
    return;
  }

  showLoading("Moving to archive...", "");

  const result = await markEmptiedDB(c);

  hideLoading();

  if (!result.success) {
    alert("Error: " + result.message);
    return;
  }

  activeDetailId = null;
  allContainers = await fetchContainers();
  renderTable();
  updateStats();
}

async function doDelete(id) {
  if (!Auth.isAdmin()) {
    alert("Only administrators can permanently remove containers.");
    return;
  }

  const c = allContainers.find(x => x.id === id);

  if (!c || !confirm(`Permanently remove ${c.container_number}? This cannot be undone.`)) {
    return;
  }

  showLoading("Removing...", "");

  const result = await deleteContainerDB(id);

  hideLoading();

  if (!result.success) {
    alert("Error: " + result.message);
    return;
  }

  activeDetailId = null;
  allContainers = await fetchContainers();
  renderTable();
  updateStats();
}

// --------------------------------------------------
// MODAL HELPERS AND EXPORTS
// --------------------------------------------------

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
}

function closeOverlay(event) {
  if (event.target.classList.contains("modal-overlay")) {
    closeModal();
  }
}

function getExportGroups() {
  const groups = new Map();

  allContainers.forEach(container => {
    const supplierName = String(container.suppliers?.name || "Unassigned").trim() || "Unassigned";
    if (!groups.has(supplierName)) groups.set(supplierName, []);
    groups.get(supplierName).push(container);
  });

  return Array.from(groups.entries())
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([name, containers]) => ({
      name,
      containers: containers.slice().sort((a, b) =>
        String(a.container_number || "").localeCompare(String(b.container_number || ""))
      )
    }));
}

function getExportStatus(container) {
  return container.status === "ARRIVED" ? "ARRIVED" : "NOT ARRIVED";
}

function getExportDate(container) {
  const value = container.eta || container.actual_arrival_at || container.arrived_at || "";
  if (!value) return "—";
  const date = new Date(String(value).slice(0, 10) + "T00:00:00");
  if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);
  return date.toLocaleDateString("en-GB", {
    day: "numeric", month: "long", year: "numeric"
  });
}
  async function doExportExcel() {
  if (!allContainers.length) {
    alert("There are no active containers to export.");
    return;
  }
  if (typeof ExcelJS === "undefined") {
    alert("The Excel export library could not load. Check your internet connection and refresh the page.");
    return;
  }

  try {
    const workbook = new ExcelJS.Workbook();
    workbook.creator = "CargoVis";
    workbook.created = new Date();
    const sheet = workbook.addWorksheet("Active Containers", {
      views: [{ state: "frozen", ySplit: 4 }],
      pageSetup: { orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
    });

    sheet.columns = [
      { key: "container", width: 20 },
      { key: "vessel", width: 30 },
      { key: "date", width: 22 },
      { key: "status", width: 18 },
      { key: "line", width: 20 },
      { key: "recipient", width: 24 }
    ];

    sheet.mergeCells("A1:F1");
    sheet.getCell("A1").value = "CARGOVIS | ACTIVE CONTAINER REPORT";
    sheet.getCell("A1").font = { name: "Arial", size: 16, bold: true, color: { argb: "FFFFFFFF" } };
    sheet.getCell("A1").fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1F3864" } };
    sheet.getCell("A1").alignment = { vertical: "middle", horizontal: "left" };
    sheet.getRow(1).height = 30;

    sheet.mergeCells("A2:F2");
    sheet.getCell("A2").value = `Generated: ${new Date().toLocaleString()}  |  Total active containers: ${allContainers.length}`;
    sheet.getCell("A2").font = { name: "Arial", size: 10, italic: true, color: { argb: "FF555555" } };
    sheet.getRow(2).height = 21;
    sheet.addRow([]);

    const headers = ["Container No.", "Vessel", "ETA / Arrival Date", "Status", "Shipping Line", "Recipient"];
    const groups = getExportGroups();

    groups.forEach((group, groupIndex) => {
      const titleRow = sheet.addRow([`${group.name}  |  ${group.containers.length} container${group.containers.length === 1 ? "" : "s"}`]);
      sheet.mergeCells(titleRow.number, 1, titleRow.number, 6);
      titleRow.height = 23;
      titleRow.getCell(1).font = { name: "Arial", size: 12, bold: true, color: { argb: "FF1F3864" } };
      titleRow.getCell(1).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFEAF0F8" } };
      titleRow.getCell(1).alignment = { vertical: "middle", indent: 1 };

      const headerRow = sheet.addRow(headers);
      headerRow.height = 22;
      headerRow.eachCell(cell => {
        cell.font = { name: "Arial", size: 10, bold: true, color: { argb: "FFFFFFFF" } };
        cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1F3864" } };
        cell.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
        cell.border = { top: { style: "thin", color: { argb: "FF9FB3D1" } }, bottom: { style: "thin", color: { argb: "FF9FB3D1" } }, left: { style: "thin", color: { argb: "FF9FB3D1" } }, right: { style: "thin", color: { argb: "FF9FB3D1" } } };
      });

      group.containers.forEach((container, index) => {
        const row = sheet.addRow([
          String(container.container_number || ""),
          String(container.vessel || ""),
          getExportDate(container),
          getExportStatus(container),
          String(container.shipping_line || ""),
          String(container.recipient || "")
        ]);
        row.height = 20;
        row.eachCell(cell => {
          cell.font = { name: "Arial", size: 10, color: { argb: "FF222222" } };
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: index % 2 === 0 ? "FFFFFFFF" : "FFEAF1F8" } };
          cell.alignment = { vertical: "middle", horizontal: "center", wrapText: true };
          cell.border = { top: { style: "thin", color: { argb: "FFD5DFEC" } }, bottom: { style: "thin", color: { argb: "FFD5DFEC" } }, left: { style: "thin", color: { argb: "FFD5DFEC" } }, right: { style: "thin", color: { argb: "FFD5DFEC" } } };
        });
        const statusCell = row.getCell(4);
        const arrived = getExportStatus(container) === "ARRIVED";
        statusCell.font = { name: "Arial", size: 9, bold: true, color: { argb: arrived ? "FF216E2B" : "FFC00000" } };
        statusCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: arrived ? "FFE2F0D9" : "FFFCE4D6" } };
      });

      if (groupIndex < groups.length - 1) sheet.addRow([]);
    });

    sheet.autoFilter = undefined;
    const today = new Date().toISOString().slice(0, 10);
    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `CargoVis_Active_Containers_${today}.xlsx`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (error) {
    console.error("Excel export failed:", error);
    alert("The Excel report could not be created. Please refresh the page and try again.");
  }
}

function doExportPDF() {
  if (!allContainers.length) {
    alert("There are no active containers to export.");
    return;
  }
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("The PDF export library could not load. Check your internet connection and refresh the page.");
    return;
  }

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    const groups = getExportGroups();
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const navy = [31, 56, 100];

    doc.setProperties({
      title: "CargoVis Active Container Report",
      subject: "Active ocean container shipments",
      author: "CargoVis"
    });

    doc.setFillColor(...navy);
    doc.rect(0, 0, pageWidth, 25, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text("CARGOVIS", 14, 11);
    doc.setFontSize(9);
    doc.setFont("helvetica", "normal");
    doc.text("ACTIVE CONTAINER REPORT", 14, 18);
    doc.setFontSize(9);
    doc.text(`Generated: ${new Date().toLocaleDateString("en-GB")}`, pageWidth - 14, 15, { align: "right" });

    let currentY = 34;
    groups.forEach(group => {
      const needed = 13 + Math.min(group.containers.length, 2) * 7;
      if (currentY + needed > pageHeight - 18) {
        doc.addPage();
        currentY = 18;
      }

      doc.setFillColor(234, 240, 248);
      doc.roundedRect(14, currentY, pageWidth - 28, 9, 1.5, 1.5, "F");
      doc.setTextColor(...navy);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11);
      doc.text(group.name, 18, currentY + 6);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.text(`Total: ${group.containers.length} container${group.containers.length === 1 ? "" : "s"}`, pageWidth - 18, currentY + 6, { align: "right" });
      currentY += 10;

      doc.autoTable({
        startY: currentY,
        head: [["Container No.", "Vessel", "ETA / Arrival Date", "Status", "Shipping Line", "Recipient"]],
        body: group.containers.map(container => [
          String(container.container_number || "—"),
          String(container.vessel || "—"),
          getExportDate(container),
          getExportStatus(container),
          String(container.shipping_line || "—"),
          String(container.recipient || "—")
        ]),
        theme: "grid",
        margin: { left: 14, right: 14, bottom: 18 },
        styles: {
          font: "helvetica", fontSize: 8, cellPadding: 2.4,
          textColor: [45, 45, 45], lineColor: [190, 204, 222], lineWidth: 0.15,
          valign: "middle", overflow: "linebreak"
        },
        headStyles: {
          fillColor: navy, textColor: [255, 255, 255], fontStyle: "bold",
          halign: "center", minCellHeight: 8
        },
        alternateRowStyles: { fillColor: [234, 241, 248] },
        columnStyles: {
          0: { cellWidth: 34 }, 1: { cellWidth: 52 }, 2: { cellWidth: 38 },
          3: { cellWidth: 30, halign: "center" }, 4: { cellWidth: 38 }, 5: { cellWidth: "auto" }
        },
        didParseCell: function (data) {
          if (data.section === "body" && data.column.index === 3) {
            const arrived = String(data.cell.raw).toUpperCase() === "ARRIVED";
            data.cell.styles.textColor = arrived ? [33, 110, 43] : [192, 0, 0];
            data.cell.styles.fillColor = arrived ? [226, 240, 217] : [252, 228, 214];
            data.cell.styles.fontStyle = "bold";
          }
        }
      });

      currentY = doc.lastAutoTable.finalY + 9;
    });

    const pageCount = doc.internal.getNumberOfPages();
    for (let page = 1; page <= pageCount; page++) {
      doc.setPage(page);
      if (page > 1) {
        doc.setFillColor(...navy);
        doc.rect(0, 0, pageWidth, 8, "F");
      }
      doc.setDrawColor(190, 204, 222);
      doc.line(14, pageHeight - 12, pageWidth - 14, pageHeight - 12);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(100, 100, 100);
      doc.text("CargoVis | Active Container Report", 14, pageHeight - 7);
      doc.text(`Page ${page} of ${pageCount}`, pageWidth - 14, pageHeight - 7, { align: "right" });
    }

    const today = new Date().toISOString().slice(0, 10);
    doc.save(`CargoVis_Active_Containers_${today}.pdf`);
  } catch (error) {
    console.error("PDF export failed:", error);
    alert("The PDF report could not be created. Please refresh the page and try again.");
  }
}
